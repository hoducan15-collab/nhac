services:
  postgres:
    image: postgres:16-alpine
    container_name: musicstudio_postgres
    environment:
      - POSTGRES_DB=musicstudiodb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicstudiodb"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicstudio_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PostgreSqlConnection=Host=postgres;Port=5432;Database=musicstudiodb;Username=postgres;Password=postgres
      - Jwt__Secret=MusicStudioSuperSecretKey2026SecureLongPhraseJwt1234567890!
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Endpoint=${OPENAI_ENDPOINT:-https://api.groq.com/openai/v1}
      - OpenAI__Model=${OPENAI_MODEL:-qwen/qwen3.8-27b}
      - MusicProvider__ApiKey=${SUNO_API_KEY:-}
      - MusicProvider__HfToken=${HF_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "5050:5000"
    volumes:
      - ./backend/src/MusicStudio.API/Storage:/app/Storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5050/api/v1
    container_name: musicstudio_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5050/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
